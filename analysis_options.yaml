analyzer:
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - unnecessary_this
    - prefer_const_constructors
    - prefer_is_empty
    - prefer_is_not_empty
